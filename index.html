<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday Bro ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:60px 20px;
}

h1{
font-size:60px;
}

.card{
background:rgba(255,255,255,0.12);
padding:30px;
border-radius:20px;
margin-top:30px;
line-height:1.8;
}

button{
padding:15px 25px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
background:gold;
font-weight:bold;
margin-top:20px;
}

#surprise{
margin-top:25px;
font-size:24px;
color:yellow;
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 Happy Birthday Bro 🎂</h1>

<h2>From Nirdosh ❤️</h2>

<div class="card">

<p>
No matter how far Australia is, you'll always be my biggest inspiration.
</p>

<p>
I am proud of everything you've achieved and all the hard work you're putting into your Master's degree.
</p>

<p>
Thank you for always supporting and guiding me.
</p>

<p>
Happy Birthday Bro ❤️
</p>

</div>

<button onclick="showSurprise()">
🎁 Open Birthday Surprise
</button>

<p id="surprise"></p>

</div>

<script>
function showSurprise(){

document.getElementById("surprise").innerHTML =
"🌟 From Nepal 🇳🇵 to Australia 🇦🇺, you'll always be my hero. Happy Birthday Bro! ❤️";

}
</script>

</body>
</html>
